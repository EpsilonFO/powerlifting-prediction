[project]
name = "regression"
version = "0.1.0"
description = "Data challenge M2 : régression de TotalKg (powerlifting), stacking de 37 modèles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "kagglehub>=1.0.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pytabkit==1.8.0",
    "rtdl-num-embeddings==0.0.12",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tabm==0.0.3",
    "torch>=2.14.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/powerlifting"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
